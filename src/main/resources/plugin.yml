name: KSR-OITC
main: ch.ksrminecraft.kSROITC.KSROITC
version: ${project.version}
api-version: '1.21'
load: POSTWORLD
author: KSR Minecraft
description: >
  One In The Chamber Minigame – entwickelt für das KSR Minecraft Netzwerk.
  Unterstützt mehrere Arenen, Zuschauer, Punktesystem (RankPointsAPI) und vollautomatische Matches.

commands:
  oitc:
    description: Hauptbefehl für das One In The Chamber Minigame.
    usage: /oitc <join|leave|watch|start|reset|setlobby|addspawn|clearspawns|listspawns|reload>
    permission: oitc.use
    aliases: [ oneinthechamber, oitchamber ]
    tab-completer: ch.ksrminecraft.kSROITC.commands.OitcTabCompleter

permissions:
  oitc.use:
    description: "Basisrechte: join/leave (nur wenn Turniermodus AUS) + watch"
    default: true

  oitc.mod:
    description: "Moderationsrechte: join/leave (auch im Turniermodus) + start/reset"
    default: op

  oitc.admin:
    description: "Adminrechte: setlobby, spawns, reload"
    default: op
